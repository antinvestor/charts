apiVersion: v1
kind: Service
metadata:
  name: {{ include "stalwart.fullname" . }}
  labels:
    {{ include "stalwart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: stalwart
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http

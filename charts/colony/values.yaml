# Default values for colony
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# NOTE: The release name (helm install <release-name>) will be used as the service name
# Example: helm install myservice ./colony -n <namespace>
# This creates a service named 'myservice' in the specified namespace

# Image configuration
image:
  repository: "ghcr.io/antinvestor/example-service"  # Required: Set to your service repository
  tag: "v1.0.0"  # Optional: Defaults to Chart.appVersion when unset
  digest: "sha256:ec0119616bb8be9199575c05bfc23a6bf0fbdb0690ee15834e7b43bc3f4f6017"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-auth

# ServiceAccount configuration
serviceAccount:
  create: true
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/IAM_ROLE_NAME
  name: ""  # Defaults to release name
  imagePullSecrets: []  # Override image pull secrets for ServiceAccount
  automountServiceAccountToken: true


# Deployment configuration
replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

# Graceful termination
terminationGracePeriodSeconds: 60

# Lifecycle hooks
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 10  # Allow time for load balancer de-registration

# Pod annotations
podAnnotations: {}

# Security context
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: null  # Let the image define the user
  runAsGroup: null
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 200m
    memory: 400Mi

# Service ports
service:
  type: ClusterIP
  # Zone-aware routing (Option 1 from Envoy Gateway docs)
  # Use ONE of these options, not both:
  topologyMode: "Auto"  # uses annotation service.kubernetes.io/topology-mode
  trafficDistribution: "PreferClose"  # e.g., "PreferClose" - uses spec.trafficDistribution

  # Dual-stack (IPv4/IPv6) configuration
  # ipFamilyPolicy options:
  #   - SingleStack: Single IP family only (default)
  #   - PreferDualStack: Dual-stack if available, single otherwise
  #   - RequireDualStack: Require dual-stack, fail if not available
  ipFamilyPolicy: "SingleStack"
  # ipFamilies specifies the order of IP families for dual-stack
  # Examples:
  #   - ["IPv4"]           # IPv4 only (default)
  #   - ["IPv6"]           # IPv6 only
  #   - ["IPv4", "IPv6"]   # Dual-stack, prefer IPv4
  #   - ["IPv6", "IPv4"]   # Dual-stack, prefer IPv6
  ipFamilies: []  # Empty uses cluster default

  grpc:
    enabled: false
    port: 50051
    targetPort: 50051
    appProtocol: ""  # e.g., kubernetes.io/h2c, grpc
  http:
    enabled: true
    port: 80
    targetPort: 80
    appProtocol: ""  # e.g., http, https, kubernetes.io/h2c

# Health probes
probes:
  # auto: tcpSocket for workload-API enabled services, otherwise use the configured probe handlers.
  # http: always use the probe handlers below as provided.
  # tcp: always replace the probe handlers below with tcpSocket on the named port.
  mode: auto
  portName: http

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 50%  # Keep at least 50% of pods available
  # maxUnavailable: 1  # OR: Allow at most 1 pod unavailable at a time
  
# Pod Anti-Affinity (spread pods across nodes)
podAntiAffinity:
  enabled: true
  type: preferred  # or "required" for strict enforcement
  topologyKey: kubernetes.io/hostname
  weight: 100  # Weight for preferred anti-affinity (1-100)

# Custom affinity rules (overrides podAntiAffinity if set)
affinity: {}

# Topology Spread Constraints
topologySpreadConstraints: []
# Example:
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app.kubernetes.io/name: colony

# Priority Class Name
priorityClassName: ""

# DNS Configuration
dnsConfig: {}
# Example:
#   options:
#     - name: ndots
#       value: "2"


# OAuth2 configuration
oauth2:
  enabled: true
  serviceUri: https://oauth2.antinvestor.com
  adminUri: http://service-authentication-oauth2-hydra-admin.core:4445

  workloadAPI:
    enabled: true
    trustDomain: stawi.org
    socketPath: /spiffe-workload-api/spire-agent.sock
    socketMountPath: /spiffe-workload-api
    csiDriver: csi.spiffe.io

  # Secret reference for OAuth2 client credentials
  # Create the secret manually before deployment:
  # kubectl create secret generic <release-name>-oauth2-cli \
  #   --from-literal=client-id='<release-name>' \
  #   --from-literal=client-secret='your-secret-here' \
  #   -n <namespace>
  clientId: ""
  clientIdRef:
    name: ""  # Leave empty to use: {release-name}-oauth2-cli
    key: client-id  # Key name in the secret
  clientSecretRef:
    name: ""  # Leave empty to use: {release-name}-oauth2-cli
    key: client-secret  # Key name in the secret

  privateJWT:
    enabled: true
    source: workload_api
    keyId: ""
    audience: ""
    spiffeID: ""
    hint: ""
    jwksPath: /.well-known/oauth2-client-jwks.json

  audience: ""  # Services this service can access
  jwtVerifyAudience: ""  # This service's audience (defaults to {release-name})

# OpenTelemetry configuration
opentelemetry:
  enabled: true
  serviceName: ""  # Defaults to release name
  environment: production
  protocol: grpc
  endpoint: http://opentelemetry-collector.telemetry.svc.cluster.local:4317
  insecure: true
  compression: gzip
  exporters:
    traces: otlp
    metrics: otlp
    logs: otlp
  metrics:
    temporalityPreference: DELTA
    histogramAggregation: BASE2_EXPONENTIAL_BUCKET_HISTOGRAM

# Gateway API configuration
gateway:
  enabled: false
  # Type: http or grpc
  type: http
  httpRoute:
    # Full spec override for HTTPRoute. When set, it replaces parentRefs/hostnames/rules.
    spec: {}
    # Custom hostnames for HTTPRoute only (defaults to gateway.hostnames)
    hostnames: []
    # Custom HTTPRoute rules array. When set, it replaces the default "/" rule.
    rules: []
  parentRef:
    kind: Gateway
    name: default
    namespace: envoy-gateway-system
    sectionName: https
  # Hostnames for external access (also used for externalDNS if enabled)
  hostnames: []  # e.g., ["myservice.antinvestor.com", "myservice.antinvestor.org"]
  timeouts:
    request: 15s
  # CORS settings for HTTPRoute
  cors:
    enabled: false
    allowOrigins:
      - "https://*"
      - "http://localhost:5173"
      - "http://localhost:8008"
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowHeaders:
      - Authorization
      - Content-Type
      - Accept
      - Origin
      - X-Requested-With
    exposeHeaders:
      - Content-Type
      - Authorization
    allowCredentials: true
    maxAge: 86400

# External DNS configuration
externalDNS:
  enabled: false
  # DNS name defaults to gateway.hostnames
  recordTTL: 180
  recordType: CNAME
  targets:
    - "prod.antinvestor.com"
  cloudflareProxied: true

# Network Policy
networkPolicy:
  enabled: false  # Enable in production for network isolation
  ingressNamespace: system-gateway  # Namespace with ingress controller
  datastoreNamespace: datastore  # Namespace with databases, NATS
  telemetryNamespace: telemetry  # Namespace with OpenTelemetry collector
  allowExternalEgress: true  # Allow HTTPS to external services (OAuth2, APIs)
  # Additional custom ingress rules
  additionalIngressRules: []
  # Example:
  # - from:
  #     - namespaceSelector:
  #         matchLabels:
  #           name: monitoring
  #   ports:
  #     - protocol: TCP
  #       port: 9090
  # Additional custom egress rules
  additionalEgressRules: []
  # Example:
  # - to:
  #     - podSelector:
  #         matchLabels:
  #           app: external-api
  #   ports:
  #     - protocol: TCP
  #       port: 8080

# FluxCD Image Automation
fluxcd:
  enabled: true
  imageRepository:
    secretRef: ghcr-auth
    interval: 10m0s
  imagePolicy:
    semver:
      range: ">=v0.0.1"

# Migration job configuration
migration:
  enabled: false
  args: ["migrate"]
  env: []
  ttlSecondsAfterFinished: 300
  backoffLimit: 15
  activeDeadlineSeconds: 1800
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# Environment variables from ConfigMaps and Secrets
envFrom: []
# Example:
# - configMapRef:
#     name: app-config
# - secretRef:
#     name: app-secrets

# Additional environment variables
env: []
# Example:
# - name: CUSTOM_VAR
#   value: "custom_value"
# - name: SECRET_VAR
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: my-key
# - name: DATABASE_USERNAME
#   valueFrom:
#     secretKeyRef:
#       name: hub-core-app
#       key: username
# - name: DATABASE_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: hub-core-app
#       key: password
# - name: DATABASE_URL
#   value: "postgres://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@pooler-rw.datastore.svc.cluster.local:5432/myservice"

# Additional volumes
volumes: []
# Example:
# - name: config
#   configMap:
#     name: my-config

# Additional volume mounts
volumeMounts: []
# Example:
# - name: config
#   mountPath: /etc/config

# Additional labels
labels: {}

# Additional annotations
annotations: {}

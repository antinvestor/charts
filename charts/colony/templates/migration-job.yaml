{{- if .Values.migration.enabled }}
{{- $migrationJobName := printf "%s-migration-%d" .Release.Name .Release.Revision | trunc 63 | trimSuffix "-" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $migrationJobName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $migrationJobName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migration
    {{- include "colony.labels" . | nindent 4 }}
  annotations:
    helm.toolkit.fluxcd.io/hook: pre-install,pre-upgrade
    helm.toolkit.fluxcd.io/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    helm.toolkit.fluxcd.io/hook-weight: "1"
spec:
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  parallelism: 1
  completions: 1
  {{- $migrationEnvNames := dict }}
  {{- range .Values.migration.env }}
  {{- if .name }}
  {{- $_ := set $migrationEnvNames .name true }}
  {{- end }}
  {{- end }}
  {{- $customMountPaths := dict }}
  {{- range .Values.volumeMounts }}
  {{- if .mountPath }}
  {{- $_ := set $customMountPaths .mountPath true }}
  {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $migrationJobName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "colony.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      restartPolicy: Never
      containers:
        - name: "{{ $migrationJobName }}"
          image: "{{ .Values.image.repository }}:{{ include "colony.imageTag" . }}"
          # imageDigest: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.migration.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          {{- if .Values.migration.args }}
          args:
            {{- toYaml .Values.migration.args | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DO_MIGRATION
              value: "true"

            {{- if .Values.oauth2.enabled }}
            {{- $serviceAccountName := include "colony.serviceAccountName" . }}
            - name: OAUTH2_SERVICE_URI
              value: {{ .Values.oauth2.serviceUri }}
            - name: OAUTH2_SERVICE_ADMIN_URI
              value: {{ .Values.oauth2.adminUri }}
            {{- if .Values.oauth2.tokenEndpointAuthMethod }}
            - name: OAUTH2_TOKEN_ENDPOINT_AUTH_METHOD
              value: {{ .Values.oauth2.tokenEndpointAuthMethod | quote }}
            {{- end }}
            {{- if .Values.oauth2.workloadAPI.enabled }}
            {{- $socketPath := .Values.oauth2.workloadAPI.socketPath }}
            - name: WORKLOAD_API_TRUSTED_DOMAIN
              value: {{ .Values.oauth2.workloadAPI.trustDomain | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: {{ if or (hasPrefix "unix://" $socketPath) (hasPrefix "tcp://" $socketPath) }}{{ $socketPath | quote }}{{ else }}{{ printf "unix://%s" $socketPath | quote }}{{ end }}
            {{- end }}
            {{- if .Values.oauth2.clientId }}
            - name: OAUTH2_SERVICE_CLIENT_ID
              value: {{ .Values.oauth2.clientId }}
            {{- else if .Values.oauth2.clientIdRef.name }}
            - name: OAUTH2_SERVICE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2.clientIdRef.name }}
                  key: {{ .Values.oauth2.clientIdRef.key }}
            {{- else }}
            - name: OAUTH2_SERVICE_CLIENT_ID
              value: {{ .Release.Name }}
            {{- end }}
            {{- if .Values.oauth2.clientSecret }}
            - name: OAUTH2_SERVICE_CLIENT_SECRET
              value: {{ .Values.oauth2.clientSecret }}
            {{- end }}
            {{- if .Values.oauth2.privateJWT.enabled }}
            {{- $jwtDict := dict "source" .Values.oauth2.privateJWT.source "signer_url" (.Values.oauth2.privateJWT.signerUrl | default "") "key_id" (.Values.oauth2.privateJWT.keyId | default "hydra.openid.id-token") "audience" (.Values.oauth2.privateJWT.audience | default (printf "%s/oauth2/token" (trimSuffix "/" .Values.oauth2.serviceUri))) "hint" .Values.oauth2.privateJWT.hint }}
            {{- if eq .Values.oauth2.privateJWT.source "workload_api" }}
            {{- $_ := set $jwtDict "spiffe_id" (.Values.oauth2.privateJWT.spiffeID | default (printf "spiffe://%s/ns/%s/sa/%s" (.Values.oauth2.workloadAPI.trustDomain | default "") .Release.Namespace $serviceAccountName)) }}
            {{- end }}
            - name: OAUTH2_PRIVATE_JWT_KEY
              value: {{ $jwtDict | toJson | quote }}
            {{- if .Values.oauth2.privateJWT.signerApiKeyRef.name }}
            - name: OAUTH2_SIGNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2.privateJWT.signerApiKeyRef.name }}
                  key: {{ .Values.oauth2.privateJWT.signerApiKeyRef.key | default "psk" }}
            {{- end }}
            {{- end }}
            {{- if .Values.oauth2.audience }}
            - name: OAUTH2_SERVICE_AUDIENCE
              value: {{ .Values.oauth2.audience }}
            {{- end }}
            - name: OAUTH2_JWT_VERIFY_AUDIENCE
              value: {{ .Values.oauth2.jwtVerifyAudience }}
            {{- end }}

            # Additional environment variables for migration
            {{- with .Values.migration.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

            {{- with .Values.env }}
            {{- range . }}
            {{- if or (not .name) (not (hasKey $migrationEnvNames .name)) }}
            {{- toYaml (list .) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- end }}

          {{- if or (and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled) .Values.volumeMounts .Values.migration.securityContext.readOnlyRootFilesystem }}
          volumeMounts:
            {{- if and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled }}
            - name: spire-workload-api
              mountPath: {{ .Values.oauth2.workloadAPI.socketMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and .Values.migration.securityContext.readOnlyRootFilesystem (not (hasKey $customMountPaths "/tmp")) }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}

      {{- if or (and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled) .Values.volumes .Values.migration.securityContext.readOnlyRootFilesystem }}
      volumes:
        {{- if and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled }}
        - name: spire-workload-api
          csi:
            driver: {{ .Values.oauth2.workloadAPI.csiDriver | quote }}
            readOnly: true
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.migration.securityContext.readOnlyRootFilesystem (not (hasKey $customMountPaths "/tmp")) }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- end }}
{{- end }}

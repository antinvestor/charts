{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration-{{ include "colony.imageHash" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-migration-{{ include "colony.imageHash" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migration
    {{- include "colony.labels" . | nindent 4 }}
  annotations:
    # Ensures migrations run BEFORE new workloads roll out
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    # FluxCD hook support (Flux reads Helm annotations)
    helm.toolkit.fluxcd.io/hook: pre-install,pre-upgrade
    helm.toolkit.fluxcd.io/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.toolkit.fluxcd.io/hook-weight: "1"

    # Helps debugging — Job name visible in UI
    reloader.stakater.com/auto: "false"

spec:
  ttlSecondsAfterFinished: {{ default 300 .Values.migration.ttlSecondsAfterFinished }}
  backoffLimit: {{ default 2 .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ default 600 .Values.migration.activeDeadlineSeconds }}
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-migration-{{ include "colony.imageHash" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never

      # Strong production recommendation: use a dedicated SA
      serviceAccountName: {{ include "colony.serviceAccountName" . }}

      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: migration
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.migration.securityContext | nindent 12 }}

          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}

          args:
            {{- if .Values.migration.args }}
            {{- toYaml .Values.migration.args | nindent 12 }}
            {{- else }}
            - "migrate"
            {{- end }}

          env:
            - name: RUN_MIGRATIONS
              value: "true"

            # Additional custom envs
            {{- with .Values.migration.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- if .Values.migration.securityContext.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}

      {{- if .Values.migration.securityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
      {{- end }}
{{- end }}

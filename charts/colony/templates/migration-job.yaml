{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ include "colony.imageHash" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-{{ include "colony.imageHash" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migration
    {{- include "colony.labels" . | nindent 4 }}
  annotations:
    # Ensures migrations run BEFORE new workloads roll out
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    # FluxCD hook support (Flux reads Helm annotations)
    helm.toolkit.fluxcd.io/hook: pre-install,pre-upgrade
    helm.toolkit.fluxcd.io/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.toolkit.fluxcd.io/hook-weight: "1"
spec:
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-{{ include "colony.imageHash" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never

      # Strong production recommendation: use a dedicated SA
      serviceAccountName: {{ include "colony.serviceAccountName" . }}

      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: "{{ .Release.Name }}-{{ include "colony.imageHash" . }}"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # imageDigest: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.migration.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          {{- if .Values.migration.args }}
          args:
            {{- toYaml .Values.migration.args | nindent 12 }}
          {{- end }}
          env:
            - name: DO_MIGRATION
              value: "true"

            # Additional environment variables for migration
            {{- with .Values.migration.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          {{- if .Values.migration.securityContext.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}

      {{- if .Values.migration.securityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
{{- end }}

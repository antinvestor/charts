apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "colony.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "colony.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "colony.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "colony.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}

      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity.type "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.podAntiAffinity.weight }}
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - {{ .Release.Name }}
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
          {{- end }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ include "colony.imageTag" . }}"
          # imageDigest: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            {{- if .Values.service.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.service.grpc.targetPort }}
            {{- end }}
            {{- if .Values.service.http.enabled }}
            - name: http
              containerPort: {{ .Values.service.http.targetPort }}
            {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycle }}
          lifecycle:
            {{- toYaml .Values.lifecycle | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $userEnvNames := dict }}
          {{- range .Values.env }}
          {{- if .name }}
          {{- $_ := set $userEnvNames .name true }}
          {{- end }}
          {{- end }}
          env:
            # Service ports
            {{- if .Values.service.http.enabled }}
            - name: HTTP_PORT
              value: {{ .Values.service.http.targetPort | quote }}
            {{- end }}
            
            # OAuth2 configuration
            {{- if .Values.oauth2.enabled }}
            {{- $serviceAccountName := include "colony.serviceAccountName" . }}
            - name: OAUTH2_SERVICE_URI
              value: {{ .Values.oauth2.serviceUri }}
            - name: OAUTH2_SERVICE_ADMIN_URI
              value: {{ .Values.oauth2.adminUri }}
            {{- if .Values.oauth2.tokenEndpointAuthMethod }}
            - name: OAUTH2_TOKEN_ENDPOINT_AUTH_METHOD
              value: {{ .Values.oauth2.tokenEndpointAuthMethod | quote }}
            {{- end }}
            {{- if .Values.oauth2.workloadAPI.enabled }}
            {{- $socketPath := .Values.oauth2.workloadAPI.socketPath }}
            - name: WORKLOAD_API_TRUSTED_DOMAIN
              value: {{ .Values.oauth2.workloadAPI.trustDomain | quote }}
            - name: SPIFFE_ENDPOINT_SOCKET
              value: {{ if or (hasPrefix "unix://" $socketPath) (hasPrefix "tcp://" $socketPath) }}{{ $socketPath | quote }}{{ else }}{{ printf "unix://%s" $socketPath | quote }}{{ end }}
            {{- end }}

            {{- if .Values.oauth2.clientId }}
            - name: OAUTH2_SERVICE_CLIENT_ID
              value: {{ .Values.oauth2.clientId }}
            {{- else if .Values.oauth2.clientIdRef.name }}
            - name: OAUTH2_SERVICE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2.clientIdRef.name }}
                  key: {{ .Values.oauth2.clientIdRef.key }}
            {{- else }}
            - name: OAUTH2_SERVICE_CLIENT_ID
              value: {{ .Release.Name }}
            {{- end }}
            {{- if ne .Values.oauth2.tokenEndpointAuthMethod "private_key_jwt" }}
            - name: OAUTH2_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2.clientSecretRef.name | default (printf "%s-oauth2-cli" .Release.Name) }}
                  key: {{ .Values.oauth2.clientSecretRef.key | default "client-secret" }}
            {{- end }}
            {{- if .Values.oauth2.privateJWT.enabled }}
            {{- $jwtDict := dict "source" .Values.oauth2.privateJWT.source "signer_url" (.Values.oauth2.privateJWT.signerUrl | default "") "key_id" (.Values.oauth2.privateJWT.keyId | default "hydra.openid.id-token") "hint" .Values.oauth2.privateJWT.hint }}
            {{- if eq .Values.oauth2.privateJWT.source "workload_api" }}
            {{- $_ := set $jwtDict "spiffe_id" (.Values.oauth2.privateJWT.spiffeID | default (printf "spiffe://%s/ns/%s/sa/%s" (.Values.oauth2.workloadAPI.trustDomain | default "") .Release.Namespace $serviceAccountName)) }}
            {{- end }}
            - name: OAUTH2_PRIVATE_JWT_KEY
              value: {{ $jwtDict | toJson | quote }}
            {{- if .Values.oauth2.privateJWT.signerApiKeyRef.name }}
            - name: OAUTH2_SIGNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2.privateJWT.signerApiKeyRef.name }}
                  key: {{ .Values.oauth2.privateJWT.signerApiKeyRef.key | default "psk" }}
            {{- end }}
            {{- end }}
            {{- /* Permission registration needs the tenancy resource audience so
                 services can call /_internal/register/permissions with a valid
                 JWT. Inject tenancy when registration is enabled so apps only
                 configure their business audiences. */}}
            {{- $requestedPaths := .Values.oauth2.requestedAudiencePaths | default list }}
            {{- if and .Values.permissionsRegistrationUrl (not (or (has "/tenancy" $requestedPaths) (has "tenancy" $requestedPaths))) }}
            {{- $requestedPaths = append $requestedPaths "/tenancy" }}
            {{- end }}
            {{- if $requestedPaths }}
            {{- $requestedAudiences := list }}
            {{- range $requestedPaths }}
            {{- $requestedAudiences = append $requestedAudiences (include "colony.oauthAudience" (dict "base" $.Values.oauth2.audienceBaseURL "path" .)) }}
            {{- end }}
            - name: OAUTH2_REQUESTED_AUDIENCES
              value: {{ join "," $requestedAudiences | quote }}
            {{- end }}
            - name: OAUTH2_RESOURCE_AUDIENCE
              value: {{ include "colony.oauthAudience" (dict "base" .Values.oauth2.audienceBaseURL "path" .Values.oauth2.resourcePath) | quote }}
            - name: OAUTH2_AUDIENCE_BASE_URL
              value: {{ include "colony.oauthAudienceBaseURL" .Values.oauth2.audienceBaseURL | quote }}
            - name: OAUTH2_CLIENT_ASSERTION_AUDIENCE
              value: {{ include "colony.oauthClientAssertionAudience" .Values.oauth2.clientAssertionAudience | quote }}
            {{- end }}

            - name: AUTHORIZATION_MODE
              value: {{ required "authorization.mode is required" .Values.authorization.mode | quote }}
            
            # Kubernetes metadata via Downward API
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.clusterName }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            {{- end }}
            
            # Logging configuration (skipped if already defined in .Values.env)
            {{- if .Values.logging }}
            {{- if and .Values.logging.level (not (hasKey $userEnvNames "LOG_LEVEL")) }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- end }}
            {{- if and .Values.logging.format (not (hasKey $userEnvNames "LOG_FORMAT")) }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            {{- end }}
            {{- end }}

            # OpenTelemetry configuration
            {{- if .Values.opentelemetry.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Release.Name | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name={{ .Release.Name }},service.namespace={{ .Release.Namespace }},service.version={{ include "colony.imageTag" . }},deployment.environment={{ .Values.opentelemetry.environment }},k8s.namespace.name=$(K8S_POD_NAMESPACE),k8s.deployment.name={{ .Release.Name }},k8s.pod.name=$(K8S_POD_NAME),k8s.pod.ip=$(K8S_POD_IP),k8s.node.name=$(K8S_NODE_NAME)"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.opentelemetry.protocol }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.opentelemetry.exporters.traces }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.opentelemetry.exporters.metrics }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.opentelemetry.exporters.logs }}
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              value: {{ .Values.opentelemetry.compression }}
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: {{ .Values.opentelemetry.metrics.temporalityPreference }}
            - name: OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION
              value: {{ .Values.opentelemetry.metrics.histogramAggregation }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.endpoint }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.opentelemetry.insecure | quote }}
            {{- end }}
            
            # Permission manifest registration
            {{- if .Values.permissionsRegistrationUrl }}
            {{- if not (hasKey $userEnvNames "PERMISSIONS_REGISTRATION_URL") }}
            - name: PERMISSIONS_REGISTRATION_URL
              value: {{ .Values.permissionsRegistrationUrl | quote }}
            {{- end }}
            {{- end }}

            # Additional environment variables
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          
          {{- if or (and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled) .Values.volumeMounts }}
          volumeMounts:
            {{- if and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled }}
            - name: spire-workload-api
              mountPath: {{ .Values.oauth2.workloadAPI.socketMountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}

      {{- if or (and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled) .Values.volumes }}
      volumes:
        {{- if and .Values.oauth2.enabled .Values.oauth2.workloadAPI.enabled }}
        - name: spire-workload-api
          csi:
            driver: {{ .Values.oauth2.workloadAPI.csiDriver | quote }}
            readOnly: true
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

{{- if and .Values.gateway.enabled (eq .Values.gateway.type "http") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "colony.labels" . | nindent 4 }}
spec:
  {{- if .Values.gateway.httpRoute.spec }}
  {{- toYaml .Values.gateway.httpRoute.spec | nindent 2 }}
  {{- else }}
  parentRefs:
    - kind: {{ .Values.gateway.parentRef.kind }}
      name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      sectionName: {{ .Values.gateway.parentRef.sectionName }}
  hostnames:
    {{- if .Values.gateway.httpRoute.hostnames }}
    {{- range .Values.gateway.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
    {{- else }}
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
    {{- end }}
  rules:
    {{- if .Values.gateway.httpRoute.rules }}
    {{- toYaml .Values.gateway.httpRoute.rules | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      {{- if .Values.gateway.cors.enabled }}
      filters:
        - type: CORS
          cors:
            allowOrigins:
              {{- toYaml .Values.gateway.cors.allowOrigins | nindent 14 }}
            allowMethods:
              {{- toYaml .Values.gateway.cors.allowMethods | nindent 14 }}
            allowHeaders:
              {{- toYaml .Values.gateway.cors.allowHeaders | nindent 14 }}
            exposeHeaders:
              {{- toYaml .Values.gateway.cors.exposeHeaders | nindent 14 }}
            allowCredentials: {{ .Values.gateway.cors.allowCredentials }}
            maxAge: {{ .Values.gateway.cors.maxAge }}
      {{- end }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.service.http.port }}
          weight: 1
      timeouts:
        request: {{ .Values.gateway.timeouts.request }}
    {{- end }}
  {{- end }}
{{- end }}

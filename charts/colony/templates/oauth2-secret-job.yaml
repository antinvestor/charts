{{- if and .Values.oauth2.enabled .Values.oauth2.autoGenerateSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "colony.fullname" . }}-oauth2-secret-gen
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "colony.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-secret-generator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: {{ include "colony.fullname" . }}
        component: oauth2-secret-generator
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "colony.fullname" . }}-oauth2-gen
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secret-generator
          image: bitnami/kubectl:{{ .Values.oauth2.secretGenerator.kubectlVersion }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              SECRET_NAME="{{ include "colony.oauth2SecretName" . }}"
              SECRET_KEY="{{ .Values.oauth2.secretGenerator.secretKey }}"
              NAMESPACE="{{ .Values.namespace }}"
              
              echo "Checking if secret ${SECRET_NAME} exists in namespace ${NAMESPACE}..."
              
              if kubectl get secret "${SECRET_NAME}" -n "${NAMESPACE}" &>/dev/null; then
                echo "Secret ${SECRET_NAME} already exists. Skipping creation."
                exit 0
              fi
              
              echo "Secret ${SECRET_NAME} does not exist. Generating..."
              
              # Generate a secure random secret (32 bytes, base64 encoded)
              CLIENT_SECRET=$(openssl rand -base64 32 | tr -d '\n')
              
              # Create the secret
              kubectl create secret generic "${SECRET_NAME}" \
                -n "${NAMESPACE}" \
                --from-literal="${SECRET_KEY}=${CLIENT_SECRET}"
              
              # Add labels for management
              kubectl label secret "${SECRET_NAME}" \
                -n "${NAMESPACE}" \
                app.kubernetes.io/name={{ include "colony.fullname" . }} \
                app.kubernetes.io/managed-by=Helm \
                app.kubernetes.io/component=oauth2-secret
              
              # Add annotations
              kubectl annotate secret "${SECRET_NAME}" \
                -n "${NAMESPACE}" \
                meta.helm.sh/release-name={{ .Release.Name }} \
                meta.helm.sh/release-namespace={{ .Release.Namespace }}
              
              echo "Secret ${SECRET_NAME} created successfully."
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "colony.fullname" . }}-oauth2-gen
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "colony.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-secret-generator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "colony.fullname" . }}-oauth2-gen
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "colony.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-secret-generator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "colony.fullname" . }}-oauth2-gen
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "colony.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-secret-generator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "colony.fullname" . }}-oauth2-gen
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "colony.fullname" . }}-oauth2-gen
  apiGroup: rbac.authorization.k8s.io
{{- end }}

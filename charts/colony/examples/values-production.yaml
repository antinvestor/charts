# Production-hardened values for Colony Helm Chart
# This example demonstrates all security and reliability improvements
# 
# NOTE: The release name (helm install <release-name>) is used as the service name
# Example: helm install myservice ./colony -f values-production.yaml -n core

# Image configuration
image:
  repository: ghcr.io/antinvestor/myservice
  tag: v1.0.0
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ghcr-auth

# High availability - 1 replica for easier debugging
replicaCount: 1

# Rolling update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1

# Graceful termination - 60s for clean shutdown
terminationGracePeriodSeconds: 60

# Lifecycle hooks for graceful shutdown
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 10  # Allow load balancer to de-register

# Pod annotations (for service mesh, etc.)
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Enhanced security context
securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true  # Enable if application supports
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Production resource limits (adjust based on profiling)
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 400Mi

# Service configuration
service:
  type: ClusterIP
  # Dual-stack configuration (IPv4/IPv6)
  # Options: SingleStack (default), PreferDualStack, RequireDualStack
  ipFamilyPolicy: "SingleStack"
  # Uncomment for dual-stack support:
  # ipFamilyPolicy: "PreferDualStack"
  # ipFamilies:
  #   - IPv4
  #   - IPv6
  grpc:
    enabled: true
    port: 50051
    targetPort: 50051
  http:
    enabled: true
    port: 80
    targetPort: 8080

# Enhanced health probes
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6  # More tolerance before restart

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30  # 150s for slow-starting apps

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# Pod Disruption Budget - percentage-based
podDisruptionBudget:
  enabled: true
  minAvailable: 50%  # Keep at least half pods available

# Pod Anti-Affinity - spread across nodes
podAntiAffinity:
  enabled: true
  type: preferred  # Use "required" if you have enough nodes
  topologyKey: kubernetes.io/hostname
  weight: 100

# Logging
logging:
  enabled: true
  level: debug

# OAuth2 configuration
# Create the secret before deployment:
# kubectl create secret generic myservice-oauth2-cli \
#   --from-literal=client-id='myservice' \
#   --from-literal=client-secret='your-secret-here' -n core
oauth2:
  enabled: true
  serviceUri: https://oauth2.antinvestor.com
  adminUri: http://service-authentication-oauth2-hydra-admin.core:4445
  
  # Secret reference (defaults to {release-name}-oauth2-cli)
  clientIdRef:
    name: ""  # Leave empty to use default: myservice-oauth2-cli
    key: client-id
  clientSecretRef:
    name: ""  # Leave empty to use default: myservice-oauth2-cli
    key: client-secret
  
  audience: "service_notifications,service_profile"
  jwtVerifyAudience: "service_myservice"

# OpenTelemetry configuration
opentelemetry:
  enabled: true
  environment: development
  protocol: grpc
  endpoint: http://opentelemetry-collector.telemetry.svc.cluster.local:4317
  insecure: true
  compression: gzip
  exporters:
    traces: otlp
    metrics: otlp
    logs: otlp
  metrics:
    temporalityPreference: DELTA
    histogramAggregation: BASE2_EXPONENTIAL_BUCKET_HISTOGRAM

# Gateway API configuration
gateway:
  enabled: true
  type: http
  parentRef:
    kind: Gateway
    name: default
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
    - myservice.antinvestor.com
    - myservice.antinvestor.org
  cors:
    enabled: true
    allowOrigins:
      - "https://*"
      - "https://app.antinvestor.com"
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowHeaders:
      - Authorization
      - Content-Type
      - Accept
      - Origin
      - X-Requested-With
    exposeHeaders:
      - Content-Type
      - Authorization
    allowCredentials: true
    maxAge: 86400

# External DNS (uses gateway.hostnames by default)
externalDNS:
  enabled: true
  recordTTL: 180
  recordType: CNAME
  targets:
    - "prod.antinvestor.com"
  cloudflareProxied: true

# Network Policy (ENABLE IN PRODUCTION)
networkPolicy:
  enabled: true
  ingressNamespace: envoy-gateway-system
  datastoreNamespace: datastore
  telemetryNamespace: telemetry
  allowExternalEgress: true
  # Add custom rules as needed
  additionalIngressRules: []
  additionalEgressRules: []

# FluxCD Image Automation
fluxcd:
  enabled: true
  imageRepository:
    secretRef: ghcr-auth
    interval: 5m0s
  imagePolicy:
    semver:
      range: ">=v1.0.0"

# Migration job
migration:
  enabled: true
  args: ["migrate"]  # Container arguments
  ttlSecondsAfterFinished: 300
  backoffLimit: 15
  activeDeadlineSeconds: 3600
  env:
    # Database connections
    - name: DATABASE_USERNAME
      valueFrom:
        secretKeyRef:
          name: hub-core-app
          key: username
    - name: DATABASE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hub-core-app
          key: password
    - name: DATABASE_URL
      value: "postgres://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@pooler-rw.datastore.svc.cluster.local:5432/myservice"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# Application-specific environment variables
env:
  # Database connections
  - name: DATABASE_USERNAME
    valueFrom:
      secretKeyRef:
        name: hub-core-app
        key: username
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: hub-core-app
        key: password
  - name: DATABASE_URL
    value: "postgres://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@pooler-rw.datastore.svc.cluster.local:5432/myservice"
  - name: REPLICA_DATABASE_URL
    value: "postgres://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@pooler-ro.datastore.svc.cluster.local:5432/myservice"
  
  # Queue connections
  - name: QUEUE_USERNAME
    valueFrom:
      secretKeyRef:
        name: queue-myservice-secret
        key: username
  - name: QUEUE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: queue-myservice-secret
        key: password
  - name: EVENTS_QUEUE_URL
    value: "nats://$(QUEUE_USERNAME):$(QUEUE_PASSWORD)@queue.datastore.svc.cluster.local:4222?subject=svc.myservice.internal._queue&consumer_durable_name=svc_myservice_internal_queue&consumer_filter_subject=svc.myservice.internal._queue&stream_name=svc_myservice&stream_subjects=svc.myservice.%3E&consumer_ack_policy=explicit&consumer_deliver_policy=all&consumer_replay_policy=instant&jetstream=true&stream_retention=workqueue&stream_storage=file"
  
  # Application-specific settings
  - name: FEATURE_FLAG_ENABLED
    value: "true"
  - name: CACHE_TTL
    value: "3600"

# Volume mounts (if using readOnlyRootFilesystem)
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache

# Additional labels
labels:
  team: platform
  cost-center: engineering
  environment: production

# Additional annotations
annotations:
  deployment.kubernetes.io/revision: "1"

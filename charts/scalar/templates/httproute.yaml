{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scalar.labels" . | nindent 4 }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
      sectionName: {{ .Values.gateway.parentRef.sectionName }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | default "/" }}
      filters:
        - type: CORS
          cors:
            allowOrigins:
              {{- toYaml .Values.gateway.cors.allowOrigins | nindent 14 }}
            allowMethods: [GET, OPTIONS]
            allowHeaders:
              - Authorization
              - Content-Type
              - Accept
              - Origin
              - X-Requested-With
              - X-Tenant-Id
              - X-Partition-Id
              - X-Access-Id
              - Connect-Protocol-Version
              - Connect-Timeout-Ms
              - Connect-Content-Encoding
              - Connect-Accept-Encoding
              - Grpc-Timeout
              - X-Grpc-Web
              - X-User-Agent
              - Baggage
              - Traceparent
              - Tracestate
            allowCredentials: true
            maxAge: 86400
      backendRefs:
        - kind: Service
          name: {{ include "scalar.serviceName" . }}
          port: {{ .Values.service.port | default 80 }}
          weight: 1
{{- end -}}

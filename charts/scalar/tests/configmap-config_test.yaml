suite: ConfigMap config
templates:
  - templates/configmap-config.yaml
tests:
  - it: renders one config.json with sources
    set:
      sources:
        - { slug: profile, title: Profile API, url: /profile/swagger.json, default: true }
        - { slug: files,   title: Files API,   url: /files/swagger.json }
    asserts:
      - equal:
          path: kind
          value: ConfigMap
      - exists:
          path: data["config.json"]
      - matchRegex:
          path: data["config.json"]
          pattern: '"slug":"profile"'
      - matchRegex:
          path: data["config.json"]
          pattern: '"slug":"files"'

  - it: includes customCss in rendered config when set
    set:
      sources:
        - { slug: x, title: X, url: /x/swagger.json }
      customCss: ":root { --x: 1; }"
    asserts:
      - matchRegex:
          path: data["config.json"]
          pattern: '"customCss":'

apiVersion: apps/v1
kind: {{ .Values.mode.kind }}
metadata:
  name: {{ include "coturn.fullname" . }}
spec:
  {{- if eq .Values.mode.kind "Deployment" }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "coturn.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "coturn.name" . }}
    spec:
      hostNetwork: {{ .Values.network.hostNetwork }}
      dnsPolicy: {{ .Values.network.dnsPolicy }}

      {{- if .Values.affinity.onePodPerNode }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ include "coturn.name" . }}
              topologyKey: kubernetes.io/hostname
      {{- end }}

      containers:
        - name: coturn
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - turnserver
            - -c
            - /etc/coturn/turnserver.conf

          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: {{ .Values.auth.secretKey }}

          ports:
            - name: turn-udp
              containerPort: {{ .Values.network.controlPort }}
              protocol: UDP
            - name: turn-tcp
              containerPort: {{ .Values.network.controlPort }}
              protocol: TCP

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              add:
                - NET_BIND_SERVICE

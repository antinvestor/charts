{{- if .Values.fluxcd.enabled }}
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: {{ include "colony.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "colony.labels" . | nindent 4 }}
spec:
  imageRepositoryRef:
    name: {{ include "colony.fullname" . }}
  policy:
    semver:
      range: {{ .Values.fluxcd.imagePolicy.semver.range | quote }}
{{- end }}
